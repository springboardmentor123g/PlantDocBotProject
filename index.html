<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlantDocBot - AI Plant Disease Diagnosis</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="logo">
                <span class="logo-icon"></span>
                <h1>PlantDocBot</h1>
            </div>
            <p class="tagline">AI-Powered Plant Disease Diagnosis</p>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Input Section -->
            <div class="input-section">
                <div class="tabs">
                    <button class="tab active" data-tab="image">📸 Image Upload</button>
                    <button class="tab" data-tab="text">💬 Describe Symptoms</button>
                    <button class="tab" data-tab="both">🔄 Both</button>
                </div>

                <!-- Image Upload Tab -->
                <div class="tab-content active" id="image-tab">
                    <div class="upload-area" id="upload-area">
                        <input type="file" id="image-input" accept="image/*" hidden>
                        <div class="upload-placeholder">
                            <span class="upload-icon">📷</span>
                            <p>Click or drag image here</p>
                            <small>Supported: JPG, PNG, JPEG</small>
                        </div>
                        <img id="preview-image" class="preview-image" style="display: none;">
                    </div>
                    <button class="btn btn-primary" id="analyze-image-btn">Analyze Image</button>
                </div>

                <!-- Text Input Tab -->
                <div class="tab-content" id="text-tab">
                    <textarea 
                        id="symptoms-input" 
                        class="symptoms-input" 
                        placeholder="Describe the symptoms you're seeing on your plant...&#10;&#10;Example: My tomato plant has brown spots on the leaves with yellow edges. The leaves are also curling upward."
                        rows="8"
                    ></textarea>
                    <button class="btn btn-primary" id="analyze-text-btn">Analyze Symptoms</button>
                </div>

                <!-- Combined Tab -->
                <div class="tab-content" id="both-tab">
                    <div class="upload-area small" id="upload-area-combined">
                        <input type="file" id="image-input-combined" accept="image/*" hidden>
                        <div class="upload-placeholder">
                            <span class="upload-icon">📷</span>
                            <p>Upload Image</p>
                        </div>
                        <img id="preview-image-combined" class="preview-image" style="display: none;">
                    </div>
                    <textarea 
                        id="symptoms-input-combined" 
                        class="symptoms-input" 
                        placeholder="Describe additional symptoms..."
                        rows="5"
                    ></textarea>
                    <button class="btn btn-primary" id="analyze-combined-btn">Analyze Both</button>
                </div>
            </div>

            <!-- Loading Spinner -->
            <div class="loading" id="loading" style="display: none;">
                <div class="spinner"></div>
                <p>Analyzing plant...</p>
            </div>

            <!-- Results Section -->
            <div class="results-section" id="results-section" style="display: none;">
                <h2>🔬 Diagnosis Results</h2>
                
                <!-- Prediction Card -->
                <div class="result-card prediction-card">
                    <h3>Primary Diagnosis</h3>
                    <div class="disease-name" id="disease-name"></div>
                    <div class="confidence-bar">
                        <div class="confidence-fill" id="confidence-fill"></div>
                    </div>
                    <p class="confidence-text" id="confidence-text"></p>
                </div>

                <!-- Disease Information -->
                <div class="result-card info-card">
                    <h3> Description</h3>
                    <p id="disease-description"></p>
                </div>

                <div class="result-card info-card">
                    <h3> Symptoms</h3>
                    <ul id="disease-symptoms"></ul>
                </div>

                <div class="result-card info-card treatment-card">
                    <h3> Treatment Recommendations</h3>
                    <ul id="disease-treatment"></ul>
                </div>

                <div class="result-card info-card prevention-card">
                    <h3> Prevention Tips</h3>
                    <ul id="disease-prevention"></ul>
                </div>

                <button class="btn btn-secondary" id="new-diagnosis-btn">New Diagnosis</button>
            </div>

            <!-- Error Message -->
            <div class="error-message" id="error-message" style="display: none;">
                <span class="error-icon"></span>
                <p id="error-text"></p>
                <button class="btn btn-secondary" onclick="hideError()">Dismiss</button>
            </div>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <p></p>
            <p class="disclaimer"></p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
