<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌱 Plant Doctor Bot</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <button type="button" class="new-chat-btn" id="newChatBtn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    New Chat
                </button>
            </div>
            <div class="chat-history" id="chatHistory">
                <div class="loading-skeleton">
                    <div class="skeleton-item"></div>
                    <div class="skeleton-item"></div>
                    <div class="skeleton-item"></div>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div class="chat-header">
                <button type="button" class="menu-toggle" id="menuToggle" aria-label="Toggle menu">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="3" y1="12" x2="21" y2="12"></line>
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="3" y1="18" x2="21" y2="18"></line>
                    </svg>
                </button>
                <div class="header-title">
                    <span class="header-icon">🌱</span>
                    <span>Plant Doctor Bot</span>
                </div>
                <div class="header-actions">
                    <button type="button" class="icon-btn" id="clearChatBtn" title="Clear current chat" style="display: none;">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="3 6 5 6 21 6"></polyline>
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="chat-body" id="chatBody">
                <div class="welcome-screen">
                    <div class="welcome-icon">🌿</div>
                    <h1 class="welcome-title">Welcome to Plant Doctor Bot</h1>
                    <p class="welcome-subtitle">Ask me about your plants or upload an image for diagnosis!</p>
                    <div class="welcome-features">
                        <div class="feature-card">
                            <span class="feature-icon">💬</span>
                            <span>Chat about plants</span>
                        </div>
                        <div class="feature-card">
                            <span class="feature-icon">📸</span>
                            <span>Upload images</span>
                        </div>
                        <div class="feature-card">
                            <span class="feature-icon">🔍</span>
                            <span>Get instant analysis</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="chat-input-container">
                <div id="imagePreview" class="image-preview">
                    <img id="previewImg" alt="Preview">
                    <div class="preview-info">
                        <span id="imageName"></span>
                        <button type="button" class="remove-img-btn" id="removeImgBtn">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="18" y1="6" x2="6" y2="18"></line>
                                <line x1="6" y1="6" x2="18" y2="18"></line>
                            </svg>
                            Remove
                        </button>
                    </div>
                </div>
                <div class="chat-input">
                    <input type="text" id="textInput" placeholder="Ask about your plant..." autocomplete="off" maxlength="500" />
                    <label class="upload-btn" title="Upload Image" id="uploadLabel">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                            <circle cx="8.5" cy="8.5" r="1.5"></circle>
                            <polyline points="21 15 16 10 5 21"></polyline>
                        </svg>
                        <input type="file" id="imageInput" accept="image/*" hidden>
                    </label>
                    <button type="button" class="send-btn" id="sendBtn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                        Send
                    </button>
                </div>
                <div class="input-info">
                    <span id="charCount">0/500</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast notification -->
    <div class="toast" id="toast"></div>

    <script src="script.js"></script>
</body>
</html>
